<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JANKEN DOJO // Arcade Battle</title>
  <!-- Google Fonts: Russo One & Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app" id="appContainer">
    <!-- HEADER DOJO -->
    <header>
      <div class="logo">🥋</div>
      <div class="header-title">
        <div class="top-meta">
          <span class="dojo-tag">TURBO DUEL // じゃんけん</span>
          <span class="win-counter">WIN: <strong id="scorePlayer">0</strong> | LOSS: <strong
              id="scoreComputer">0</strong></span>
        </div>
        <h1>SUIT SHOWDOWN</h1>
        <p>Batu • Gunting • Kertas • Ultimate</p>
      </div>
    </header>

    <main>
      <!-- FIGHTING HUD: HEALTH BARS (100 HP) -->
      <div class="hud-board">
        <!-- Sudut Pemain -->
        <div class="fighter-hud player-hud">
          <div class="hud-top">
            <span class="fighter-name">P1 // KAMU</span>
            <span class="hp-number"><strong id="hpPlayerText">100</strong> HP</span>
          </div>
          <div class="hp-bar-outer">
            <div class="hp-bar-inner player-hp-fill" id="hpPlayerBar"></div>
          </div>
        </div>

        <div class="vs">VS</div>

        <!-- Sudut Komputer -->
        <div class="fighter-hud cpu-hud">
          <div class="hud-top">
            <span class="fighter-name">CPU // MASTER</span>
            <span class="hp-number"><strong id="hpComputerText">100</strong> HP</span>
          </div>
          <div class="hp-bar-outer">
            <div class="hp-bar-inner cpu-hp-fill" id="hpComputerBar"></div>
          </div>
        </div>
      </div>

      <section class="game-area">
        <!-- Banner Pengumuman Ronde -->
        <div class="announcer-banner">
          <h2 id="message">Pilih senjatamu untuk menyerang!</h2>
        </div>

        <!-- 3 Kartu Senjata Utama -->
        <div class="choices">
          <button class="choice" data-choice="batu">
            <div class="choice-badge">20 DMG</div>
            <span>🪨</span>
            <small>Batu</small>
          </button>

          <button class="choice" data-choice="gunting">
            <div class="choice-badge">20 DMG</div>
            <span>✂️</span>
            <small>Gunting</small>
          </button>

          <button class="choice" data-choice="kertas">
            <div class="choice-badge">20 DMG</div>
            <span>📄</span>
            <small>Kertas</small>
          </button>
        </div>

        <!-- BAR ENERGI & TOMBOL JURUS ULTIMATE -->
        <div class="ultimate-section">
          <div class="rage-header">
            <span>⚡ ENERGI ULTIMATE (RAGE)</span>
            <span id="rageText">0%</span>
          </div>
          <div class="rage-bar-outer">
            <div class="rage-bar-inner" id="rageBar"></div>
          </div>
          <button class="ult-btn" id="ultBtn" disabled>
            🐉 JURUS NAGA (TERKUNCI - PENUHKAN ENERGI)
          </button>
        </div>

        <!-- Arena Benturan (Clash Ring) -->
        <div class="result" id="result">
          <div class="player-choice">
            <div class="icon-frame player-frame" id="playerFrame">
              <span id="playerIcon">❔</span>
            </div>
            <p>Kamu</p>
          </div>

          <div class="result-text">
            <span id="resultTitle" class="status-idle">READY</span>
            <small id="resultDescription">100 HP Battle</small>
          </div>

          <div class="computer-choice">
            <div class="icon-frame cpu-frame" id="cpuFrame">
              <span id="computerIcon">❔</span>
            </div>
            <p>Komputer</p>
          </div>
        </div>

        <!-- Tombol Reset / Main Lagi -->
        <button class="reset-btn" id="resetBtn">
          🔄 RONDE BARU / PULIHKAN HP
        </button>
      </section>
    </main>

    <footer>
      <p>© 2026 JANKEN DOJO • ULTIMATE ARCADE EDITION</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>

</html>
